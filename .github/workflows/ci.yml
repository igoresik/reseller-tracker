name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # windows because vault.py uses DPAPI there
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests
